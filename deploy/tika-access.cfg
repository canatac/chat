# Relais TCP en flux : aucun corps HTTP stocké sur disque ou dans les logs.
# Le seul destinataire autorisé est Tika sur le réseau Docker interne.
global
    maxconn 16
    nbthread 1
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 5s
    timeout client 180s
    timeout server 180s
    timeout queue 5s

# Une recréation du conteneur Tika peut changer son IP.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 1s
    hold timeout 1s
    hold refused 1s
    hold other 1s

frontend tika_local
    bind :9998
    maxconn 8
    default_backend tika_backend

backend tika_backend
    server tika tika:9998 resolvers docker resolve-prefer ipv4 init-addr libc,none
