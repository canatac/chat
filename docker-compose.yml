services:
  chat:
    build: .
    container_name: chat-pme
    restart: unless-stopped
    ports:
      - "${CHAT_BIND:-0.0.0.0}:${PORT:-4000}:4000"
    env_file:
      - .env
    volumes:
      - chat-data:/app/data
      # .env monté en lecture seule et relu par l'app à chaque démarrage :
      # après édition du .env, `docker compose restart chat` suffit (pas besoin de recréer le conteneur)
      - ./.env:/app/.env:ro

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command: >
      -n
      --realm=${TURN_REALM:-chat.local}
      --user=${TURN_USERNAME:-chat}:${TURN_CREDENTIAL:-change-me}
      --external-ip=${TURN_EXTERNAL_IP:?Définir TURN_EXTERNAL_IP (IP publique de la VM) dans .env}
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --no-cli --no-tls --no-dtls
      --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

  wireguard:
    image: linuxserver/wireguard:1.0.20250521
    container_name: chat-wg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - SERVERURL=${WG_SERVERURL:-auto}
      - SERVERPORT=${WG_PORT:-51820}
      - PEERS=${WG_PEERS:-pc,telephone}
      - SERVERADDR=10.66.66.1
      - INTERNAL_SUBNET=10.66.66.0/24
      - ALLOWEDIPS=0.0.0.0/0
      - PEERDNS=1.1.1.1,8.8.8.8
      - LOG_CONFS=true
    volumes:
      - wg-config:/config
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?Définir DOMAIN dans .env pour activer le profil https}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - chat

volumes:
  chat-data:
  wg-config:
  caddy-data:
  caddy-config:
