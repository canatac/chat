services:
  chat:
    build: .
    container_name: chat-pme
    restart: unless-stopped
    network_mode: host
    cpus: 0.75
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 192
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    environment:
      HOST: "${HOST:-127.0.0.1}"
      NODE_OPTIONS: "--max-old-space-size=1024"
    env_file:
      - .env
    volumes:
      - chat-data:/app/data
      # .env monté en lecture seule et relu par l'app à chaque démarrage :
      # après édition du .env, `docker compose restart chat` suffit (pas besoin de recréer le conteneur)
      - ./.env:/app/.env:ro

  tika:
    image: apache/tika:4.2.0-full
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m -XX:ActiveProcessorCount=1 -Djava.io.tmpdir=/tmp"
      OMP_THREAD_LIMIT: "1"
      OMP_NUM_THREADS: "1"
    ports:
      - "127.0.0.1:9998:9998"
    networks:
      - documents-local
    tmpfs:
      - /tmp:size=512m,mode=1777,noexec,nosuid
    volumes:
      - ./deploy/tika-config.json:/etc/tika-config.json:ro
    command: ["-c", "/etc/tika-config.json"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command: >
      -n
      --realm=${TURN_REALM:-chat.local}
      --user=${TURN_USERNAME:-chat}:${TURN_CREDENTIAL:-change-me}
      --external-ip=${TURN_EXTERNAL_IP:?Définir TURN_EXTERNAL_IP (IP publique de la VM) dans .env}
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --no-cli --no-tls --no-dtls
      --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

  wireguard:
    image: linuxserver/wireguard:1.0.20250521
    container_name: chat-wg
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - SERVERURL=${WG_SERVERURL:-auto}
      - SERVERPORT=${WG_PORT:-51820}
      - PEERS=${WG_PEERS:-pc,telephone}
      - SERVERADDR=10.66.66.1
      - INTERNAL_SUBNET=10.66.66.0/24
      - ALLOWEDIPS=0.0.0.0/0
      - PEERDNS=1.1.1.1,8.8.8.8
      - LOG_CONFS=true
    volumes:
      - wg-config:/config
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    restart: unless-stopped
    network_mode: host
    environment:
      - DOMAIN=${DOMAIN:?Définir DOMAIN dans .env pour activer le profil https}
      - CHAT_UPSTREAM=127.0.0.1:${PORT:-4000}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - chat

volumes:
  chat-data:
  wg-config:
  caddy-data:
  caddy-config:

networks:
  documents-local:
    internal: true
