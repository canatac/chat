services:
  chat:
    build: .
    container_name: chat-pme
    restart: unless-stopped
    ports:
      - "${CHAT_BIND:-0.0.0.0}:${PORT:-4000}:4000"
    env_file:
      - .env
    volumes:
      - chat-data:/app/data

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    command: >
      -n
      --realm=${TURN_REALM:-chat.local}
      --user=${TURN_USERNAME:-chat}:${TURN_CREDENTIAL:-change-me}
      --external-ip=${TURN_EXTERNAL_IP:?Définir TURN_EXTERNAL_IP (IP publique de la VM) dans .env}
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --no-cli --no-tls --no-dtls
      --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

  caddy:
    image: caddy:2-alpine
    profiles:
      - https
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?Définir DOMAIN dans .env pour activer le profil https}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - chat

volumes:
  chat-data:
  caddy-data:
  caddy-config:
